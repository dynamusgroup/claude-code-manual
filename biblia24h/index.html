<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Bíblia24h — Acompanhando sua jornada com Deus 24 horas por dia</title>
  <meta name="description" content="Bíblia24h — Mais que uma Bíblia. Um ecossistema completo de crescimento espiritual." />
  <meta name="theme-color" content="#8B3DFF" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="device" id="device">
    <!-- Mock status bar -->
    <div class="statusbar">
      <span id="sb-time">9:41</span>
      <div class="sb-right">
        <svg viewBox="0 0 24 24" fill="none"><path d="M2 16c0-1 .5-2 2-2s2 1 2 2v3H2v-3zM9 12c0-1 .5-2 2-2s2 1 2 2v7H9v-7zM16 7c0-1 .5-2 2-2s2 1 2 2v12h-4V7z" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5c3 0 5.7 1.2 7.6 3.1l-1.4 1.4C16.6 8 14.4 7 12 7S7.4 8 5.8 9.5L4.4 8.1C6.3 6.2 9 5 12 5zm0 4c1.9 0 3.6.8 4.9 2l-1.4 1.4c-.9-.9-2.1-1.4-3.5-1.4s-2.6.5-3.5 1.4L7.1 11C8.4 9.8 10.1 9 12 9zm0 4c.8 0 1.6.3 2.1.9L12 16l-2.1-2.1c.5-.6 1.3-.9 2.1-.9z" fill="currentColor"/></svg>
        <svg viewBox="0 0 28 24" fill="none"><rect x="1" y="6" width="22" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="8" width="17" height="8" rx="1.5" fill="currentColor"/><rect x="24" y="10" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </div>
    </div>

    <!-- App screens render here -->
    <div class="viewport">
      <div class="screen" id="screen"></div>
      <div class="mini-player" id="miniPlayer">
        <div class="mp-art" id="mpArt">🎧</div>
        <div class="mp-info">
          <div class="t" id="mpTitle">—</div>
          <div class="s" id="mpSub">Bíblia24h Áudio</div>
        </div>
        <button class="mp-btn" id="mpToggle" aria-label="play/pause">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <div class="mp-line"></div>
      </div>
    </div>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" id="bottomNav"></nav>

    <!-- Sheets / modals -->
    <div class="sheet-backdrop" id="sheetBackdrop">
      <div class="sheet" id="sheet"></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
