<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cena 9:16</title>
<!-- Renderize com: node ../scripts/render_scene.js scene-template.html saida.mp4 --dur 10 -->
<!-- Fontes: coloque .ttf em ./fonts/ e descomente @font-face. Sem isso cai no fallback do sistema. -->
<style>
/* @font-face{font-family:Syne;src:url(fonts/syne-800.ttf);font-weight:800}
   @font-face{font-family:Manrope;src:url(fonts/manrope-700.ttf);font-weight:700} */

/* ===== TOKENS (troque o tema com <body class="theme-...">) ===== */
:root{
  /* Estilo "timeline creme" (vídeo C4) — padrão */
  --bg:#E8E1D5; --ink:#1B1A18; --muted:#9A9288; --accent:#D96D54; --accent-soft:#F6D3C8;
  --card:#FBF8F3; --line:#D96D54; --shadow:0 18px 50px rgba(60,40,20,.14);
  --font-head:"Syne","Manrope",system-ui,sans-serif; --font-body:"Manrope",system-ui,sans-serif;
}
body.theme-dark{ --bg:#0E0C10; --ink:#F4EFE9; --muted:#8E8795; --accent:#D96D54; --accent-soft:#3A1F1A; --card:#17141B; --line:#2A2530; --shadow:0 18px 60px rgba(0,0,0,.5);
  --font-head:"Oswald","Anton","Bebas Neue",Impact,sans-serif; }
body.theme-site{ --bg:#0B0716; --ink:#F5F0FF; --muted:#B4A9C6; --accent:#C7A7FF; --accent-soft:#2A1D44; --card:#120C22; --line:#FFFFFF20; --shadow:0 18px 60px rgba(60,20,120,.35); }

*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
#stage{position:relative;width:1080px;height:1920px;
  background:radial-gradient(ellipse 80% 40% at 90% 12%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--bg)}
/* zonas seguras (UI de Reels/Shorts cobre topo ~250px e base ~380px) */
.safe{position:absolute;left:72px;right:72px;top:250px;bottom:380px}
.abs{position:absolute}
.kicker{font:700 30px/1 var(--font-body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.headline{font:800 120px/1.02 var(--font-head);letter-spacing:-.03em}
.theme-dark .headline{text-transform:uppercase;font-weight:700;letter-spacing:-.01em}
.hl{background:var(--accent);color:#fff;padding:0 .22em .06em;border-radius:.22em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.accent{color:var(--accent)}
.pill{display:inline-flex;gap:12px;align-items:center;background:var(--accent);color:#fff;font:700 30px/1 var(--font-body);padding:14px 26px;border-radius:999px;box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:36px;box-shadow:var(--shadow);padding:44px}
.spine{position:absolute;left:54px;top:0;bottom:0;width:4px;background:var(--line)}
.caption{font:800 64px/1.15 var(--font-body);text-align:center}
</style>
</head>
<body><!-- theme-cream (padrão) | theme-dark | theme-site -->
<div id="stage">
  <div class="spine" data-anim="fade" data-in="0" data-out="10"></div>
  <div class="abs" style="left:110px;top:420px" data-anim="pop" data-in="0.2"><span class="pill">01 · Uma pasta</span></div>
  <div class="abs headline" style="left:110px;top:540px;width:860px" data-anim="up" data-in="0.5">
    Depois, cria uma <span class="hl">pasta</span>
  </div>
  <div class="abs card" style="left:110px;top:900px;width:860px;height:420px" data-anim="up" data-in="1.4">
    <div class="kicker">Claude enxerga</div>
  </div>
  <div class="abs caption" style="left:72px;right:72px;top:1500px" data-anim="up" data-in="2.2" data-out="5">os seus <span class="accent">arquivos.</span></div>
</div>

<script>
/* ===== MOTOR DETERMINÍSTICO =====
   Cada elemento com data-anim recebe: data-in (s) [data-out (s)] [data-dur (s)].
   Animações: fade | up | pop | wipe | type | tint (palavra cinza→escura na hora da fala). window.seek(t) posiciona tudo — é o que o renderizador chama. */
const E = {
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const items = [...document.querySelectorAll('[data-anim]')].map(el => ({
  el, kind: el.dataset.anim, tin: +el.dataset.in || 0, tout: el.dataset.out ? +el.dataset.out : Infinity,
  dur: +el.dataset.dur || 0.45, col: getComputedStyle(el).color, text: el.dataset.anim === 'type' ? el.textContent : null
}));
window.seek = function (t) {
  for (const it of items) {
    const p = clamp((t - it.tin) / it.dur), q = it.tout === Infinity ? 0 : clamp((t - it.tout) / 0.25);
    const vis = it.kind === 'tint' ? true : (t >= it.tin && t < it.tout + 0.25);
    const o = E.out(p) * (1 - q);
    const s = it.el.style;
    s.visibility = vis ? 'visible' : 'hidden';
    if (!vis) continue;
    s.opacity = o; s.transform = ''; s.clipPath = '';
    if (it.kind === 'up')   s.transform = `translateY(${(1 - E.out(p)) * 60}px)`;
    if (it.kind === 'pop')  s.transform = `scale(${0.6 + 0.4 * E.back(p)})`;
    if (it.kind === 'wipe') { s.opacity = 1 - q; s.clipPath = `inset(0 ${(1 - E.out(p)) * 100}% 0 0)`; }
    if (it.kind === 'tint') { s.opacity = 1; s.color = `color-mix(in srgb, ${it.col} ${E.out(p) * 100}%, var(--muted))`; }
    if (it.kind === 'type') { it.el.textContent = it.text.slice(0, Math.round(it.text.length * p)); s.opacity = 1 - q; }
  }
};
window.seek(0);
</script>
</body>
</html>
